name: "MCPDoctor Config Guard"
description: "Scan Model Context Protocol configuration files for deterministic security and configuration review signals."
author: "BLCCoreStudio"

branding:
  icon: "activity"
  color: "blue"

inputs:
  config:
    description: "Path to the MCP configuration file to inspect."
    required: true
  mode:
    description: "Inspection mode: scan or doctor."
    required: false
    default: "scan"

runs:
  using: "composite"
  steps:
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: 1.74.0

    - name: Run MCPDoctor
      shell: bash
      env:
        MCPDOCTOR_INPUT_CONFIG: ${{ inputs.config }}
        MCPDOCTOR_INPUT_MODE: ${{ inputs.mode }}
      run: bash "$GITHUB_ACTION_PATH/action-entrypoint.sh"
